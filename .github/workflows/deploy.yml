name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: "deploy"
  cancel-in-progress: true

# extensions.froste.top 由 Cloudflare Pages 直接从 master 分支构建并托管
# （构建命令 npm run build，产物目录 build/）。本工作流仅作为「构建是否能通过」
# 的校验；实际部署由 Cloudflare 在 push 到 master 时自动完成，无需此处推送。
# 注意：不要再把产物推到 gh-pages 分支——Cloudflare 若在 gh-pages 上跑
# npm run build 会因没有 package.json 而失败（ENOENT）。

jobs:
  build:
    runs-on: ubuntu-latest
    # 仅校验官方 FrostEditor 仓库。
    if: ${{ github.repository == 'FrostEditor/extensions' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build for production
        run: npm run build
