name: Sync Extension from Issue

# 管理员关闭议题后，自动把议题里的扩展同步到扩展库并触发部署。
# 议题格式示例：
#   名称：我的扩展
#   版本：1.0.0
#   作者：张三
# 附件要求：
#   - 扩展代码：xxx.js
#   - 封面图：pb.png 或直接拖拽一张图片（作为该扩展的封面）

on:
  issues:
    types: [closed]

permissions:
  issues: read
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.issue.body, '名称')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse issue and sync extension
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const issueNumber = context.payload.issue.number;

            // 通过 API 取最新 issue 正文（附件以 markdown 链接形式存在于 body/评论中）
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            const body = issue.data.body || '';

            // 仅允许有关联写入/管理员权限的人关闭的议题同步（兼容组织仓库）
            try {
              const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: github.actor
              });
              if (!['admin', 'write'].includes(perm.permission)) {
                core.info('关闭者(' + github.actor + ') 无写入权限，跳过同步。');
                return;
              }
            } catch (e) {
              core.info('权限校验失败，跳过：' + e.message);
              return;
            }

            // 解析「名称 / 版本 / 作者」，支持每条一行或挤在一行
            const field = (label, nextLabels) => {
              const esc = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const next = (nextLabels || []).map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
              const pat = next
                ? `${esc}\\s*[:：]\\s*([\\s\\S]*?)(?=${next}\\s*[:：]|$)`
                : `${esc}\\s*[:：]\\s*([\\s\\S]*?)$`;
              const m = body.match(new RegExp(pat, 'i'));
              return m ? m[1].trim() : '';
            };
            const name = field('名称', ['版本', '作者']);
            const version = field('版本', ['作者']);
            const author = field('作者');

            if (!name) {
              core.info('议题未包含「名称」，跳过。');
              return;
            }

            // 生成 ASCII 安全的 slug/id（支持中文等任意名称）
            // - 若名称含 ASCII 字母/数字，则清洗为 ascii slug
            // - 否则用名称的确定性短哈希（ext-xxxxxx），避免空 slug 导致失败
            function makeSlug(input) {
              const lower = (input || '').toLowerCase().trim();
              let s = lower
                .replace(/\s+/g, '-')
                .replace(/[^a-z0-9-]/g, '')
                .replace(/-+/g, '-')
                .replace(/^-+|-+$/g, '');
              if (s) return s;
              let h = 0;
              for (let i = 0; i < (input || '').length; i++) {
                h = (Math.imul(31, h) + input.charCodeAt(i)) | 0;
              }
              return 'ext-' + (h >>> 0).toString(36);
            }
            let slug = makeSlug(name);
            if (!slug) {
              core.setFailed('无法从「名称」生成标识：' + name);
              return;
            }

            const extDir = 'extensions/extensions';
            fs.mkdirSync(extDir, { recursive: true });

            // 加载现有列表用于 slug 去重
            const jsonPath = path.join(extDir, 'extensions.json');
            let list = [];
            if (fs.existsSync(jsonPath)) {
              const raw = fs.readFileSync(jsonPath, 'utf-8').replace(/\/\/.*$/gm, '').trim();
              try { list = JSON.parse(raw || '[]'); } catch (e) { list = []; }
            }
            if (!Array.isArray(list)) list = [];
            if (list.includes(slug)) {
              let i = 2;
              while (list.includes(slug + '-' + i)) i++;
              slug = slug + '-' + i;
            }

            // 收集议题正文 + 所有评论里的 .js 附件链接
            // 同时兼容新版 github user-attachments 链接（无 .js 后缀形式）
            const collectJs = (text) => {
              const out = [];
              for (const m of (text || '').matchAll(/https?:\/\/[^\s)\]]+\.js/gi)) out.push(m[0]);
              for (const m of (text || '').matchAll(/https?:\/\/github\.com\/user-attachments\/files\/[^\s)\]]+/gi)) out.push(m[0]);
              return out;
            };
            const jsUrls = collectJs(body);
            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              });
              for (const c of (comments.data || [])) jsUrls.push(...collectJs(c.body));
            } catch (e) {
              core.info('读取评论失败，仅使用正文链接：' + e.message);
            }
            if (jsUrls.length === 0) {
              core.setFailed('议题正文及评论中均未找到 .js 附件链接。');
              return;
            }
            const jsUrl = jsUrls[0];

            // 下载 .js（跟随重定向，带 token 以兼容私有仓库）
            const res = await fetch(jsUrl, {
              redirect: 'follow',
              headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}` }
            });
            if (!res.ok) {
              core.setFailed('下载扩展失败：HTTP ' + res.status);
              return;
            }
            let code = await res.text();

            // 若 .js 缺少元信息头，用议题字段补齐
            if (!/^\s*\/\//.test(code)) {
              const header = [
                '// id: ' + slug,
                '// name: ' + name,
                author ? '// by: ' + author : '',
                version ? '// version: ' + version : ''
              ].filter(Boolean).join('\n');
              code = header + '\n' + code;
            }

            fs.writeFileSync(path.join(extDir, slug + '.js'), code);

            // 收集封面图：优先名为 pb.png 的附件，其次任意图片附件。
            // 兼容 github user-attachments/assets/<uuid> 形式（无 .png 后缀）。
            const collectImg = (text) => {
              const out = [];
              for (const m of (text || '').matchAll(/https?:\/\/[^\s)\]]+\.(?:png|jpe?g|gif|webp)/gi)) out.push(m[0]);
              for (const m of (text || '').matchAll(/https?:\/\/github\.com\/user-attachments\/assets\/[^\s)\]]+/gi)) out.push(m[0]);
              return out;
            };
            const imgUrls = collectImg(body);
            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              });
              for (const c of (comments.data || [])) imgUrls.push(...collectImg(c.body));
            } catch (e) { /* 忽略 */ }
            const pbUrl = imgUrls.find(u => /\/pb\.png(\?|$)/i.test(u)) || imgUrls[0];

            let imagePath = null;
            if (pbUrl) {
              try {
                const imgRes = await fetch(pbUrl, {
                  redirect: 'follow',
                  headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}` }
                });
                if (imgRes.ok) {
                  const buf = Buffer.from(await imgRes.arrayBuffer());
                  // 依据真实内容判定扩展名（github 可能把 png 重命名为 uuid）
                  const isPng = buf[0] === 0x89 && buf[1] === 0x50 && buf[2] === 0x4e && buf[3] === 0x47;
                  const isJpg = buf[0] === 0xff && buf[1] === 0xd8 && buf[2] === 0xff;
                  const ext = isJpg ? 'jpg' : 'png';
                  const imgDir = 'extensions/images';
                  fs.mkdirSync(imgDir, { recursive: true });
                  imagePath = path.join(imgDir, slug + '.' + ext);
                  fs.writeFileSync(imagePath, buf);
                  core.info('已保存封面图：' + path.basename(imagePath));
                } else {
                  core.info('封面图下载失败：HTTP ' + imgRes.status);
                }
              } catch (e) {
                core.info('封面图处理出错：' + e.message);
              }
            } else {
              core.info('未找到封面图，将使用默认封面。');
            }

            // 更新 extensions.json（受支持的扩展列表）
            if (!list.includes(slug)) list.push(slug);
            fs.writeFileSync(jsonPath, JSON.stringify(list, null, 2) + '\n');

            // 提交并推送
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
            const addTargets = [jsonPath, path.join(extDir, slug + '.js')];
            if (imagePath) addTargets.push(imagePath);
            execSync(`git add ${addTargets.join(' ')}`);
            execSync(`git commit -m "sync: ${slug} (from issue #${issueNumber})"`);
            execSync('git push');

            // 触发部署工作流（GITHUB_TOKEN 的 push 不会自动触发其它工作流，故显式调度）
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'master'
            });
