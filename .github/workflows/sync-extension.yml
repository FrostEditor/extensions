name: Sync Extension from Issue

# 管理员关闭议题后，自动把议题里的扩展同步到扩展库并触发部署。
# 元数据以【议题正文】为唯一来源（不解析 js 文件的头注释，js 只是附件）：
#   扩展名称：我的扩展
#   作者：张三
#   版本号：1.0.0
#   简介：这个扩展是干什么的
# 附件要求：
#   - 扩展代码：xxx.js（仅作为代码本体，其自带头注释会被议题元数据覆盖）
#   - 封面图：pb.png 或直接拖拽一张图片（作为该扩展的封面）
#
# 调试日志：本工作流每一步都会用 core.info 打印详细日志（含 ::group:: 分组），
# 关闭议题后到 GitHub 仓库 Actions 标签页点开本运行即可查看（这就是同步过程的"控制台"）。

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '要同步的议题编号（留空则使用「议题关闭」事件里的议题）'
        required: false

permissions:
  issues: read
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.issue && contains(github.event.issue.body, '名称'))
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse issue and sync extension
        uses: actions/github-script@v7
        with:
          issue_number: ${{ github.event.inputs.issue_number }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            // ===== 统一的日志辅助 =====
            const log = (...a) => core.info(a.join(' '));
            const group = (title) => core.info('::group::' + title);
            const endGroup = () => core.info('::endgroup::');

            const issueNumberInput = core.getInput('issue_number');
            const issueNumber = issueNumberInput ? parseInt(issueNumberInput, 10) : context.payload.issue.number;
            if (!issueNumber) {
              core.setFailed('未提供议题编号：workflow_dispatch 触发时需填写 issue_number，或经由「议题关闭」事件触发。');
              return;
            }
            const issueTitle = context.payload.issue ? (context.payload.issue.title || '(无标题)') : '(手动触发 #' + issueNumber + ')';

            // ===== 运行开始：基本信息 =====
            group('① 同步任务启动');
            log('仓库     :', context.repo.owner + '/' + context.repo.repo);
            log('议题编号 :', '#' + issueNumber, '—', JSON.stringify(issueTitle));
            log('关闭者   :', github.actor);
            log('触发事件 :', context.eventName + '/' + (context.payload.action || ''));
            endGroup();

            // 通过 API 取最新 issue 正文（附件以 markdown 链接形式存在于 body/评论中）
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            const body = issue.data.body || '';

            // ===== 议题正文 =====
            group('② 议题正文（截断 2000 字）');
            log(body.length > 2000 ? body.slice(0, 2000) + '\n…(已截断)' : body || '(空)');
            endGroup();

            // 本仓库为个人/信任仓库，议题关闭即视为可信来源，跳过组织级权限校验
            // （getCollaboratorPermissionLevel 需要 GITHUB_TOKEN 无法获得的 administration 作用域，
            //  保留会稳定 403，故直接放行）。
            group('③ 权限校验');
            log('跳过组织级权限校验（个人/信任仓库，议题关闭即同步）。触发者 =', github.actor);
            endGroup();

            // 解析议题正文字段（元数据唯一来源）：扩展名称 / 作者 / 版本号 / 简介
            // 兼容别名与任意顺序；冒号支持中英文，版本号可省略冒号
            const ALL_LABELS = ['扩展名称', '名称', '作者', '版本号', '版本', '简介', '描述'];
            const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const field = (...aliases) => {
              const stops = ALL_LABELS.filter(l => !aliases.includes(l)).map(escRe).join('|');
              for (const label of aliases) {
                const pat = `${escRe(label)}\\s*[:：]?\\s*([^\\n]*?)(?=(?:${stops})\\s*[:：]|\\n|$)`;
                const m = body.match(new RegExp(pat, 'i'));
                if (m && m[1].trim()) return m[1].trim();
              }
              return '';
            };

            // ===== 字段解析（只信议题正文，不解析 js 头注释）=====
            group('④ 解析议题字段');
            const name = field('扩展名称', '名称');
            // 作者链接一律删除：去掉 <link> 尖括号段、markdown 链接与裸 URL，只留人名
            const authorRaw = field('作者');
            const author = authorRaw
              .replace(/<[^>]*>/g, '')
              .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
              .replace(/https?:\/\/\S+/gi, '')
              .trim();
            const version = field('版本号', '版本');
            const summary = field('简介', '描述');
            log('扩展名称 :', JSON.stringify(name));
            log('作者     :', JSON.stringify(author) || '(空)', authorRaw !== author ? '（已剔除链接）' : '');
            log('版本号   :', JSON.stringify(version) || '(空)');
            log('简介     :', JSON.stringify(summary) || '(空)');
            endGroup();

            if (!name) {
              core.setFailed('议题未包含「扩展名称」字段，无法同步。');
              return;
            }

            // 生成 ASCII 安全的 slug/id（支持中文等任意名称）
            function makeSlug(input) {
              const lower = (input || '').toLowerCase().trim();
              let s = lower
                .replace(/\s+/g, '-')
                .replace(/[^a-z0-9-]/g, '')
                .replace(/-+/g, '-')
                .replace(/^-+|-+$/g, '');
              if (s) return s;
              let h = 0;
              for (let i = 0; i < (input || '').length; i++) {
                h = (Math.imul(31, h) + input.charCodeAt(i)) | 0;
              }
              return 'ext-' + (h >>> 0).toString(36);
            }

            // ===== slug 生成 + 去重 =====
            group('⑤ 生成 slug 与去重');
            let slug = makeSlug(name);
            log('原始名称 :', JSON.stringify(name));
            log('初始 slug :', slug);

            const extDir = 'extensions';
            fs.mkdirSync(extDir, { recursive: true });

            const jsonPath = path.join(extDir, 'extensions.json');
            let list = [];
            if (fs.existsSync(jsonPath)) {
              const raw = fs.readFileSync(jsonPath, 'utf-8').replace(/\/\/.*$/gm, '').trim();
              try { list = JSON.parse(raw || '[]'); } catch (e) { list = []; }
            }
            if (!Array.isArray(list)) list = [];
            log('当前列表已含扩展数 :', list.length);

            // 同一议题重复关闭（reopen 后再 close / 手动重跑）时，
            // 复用已有 slug 覆盖更新，而不是生成新扩展造成重复。
            // 依据：已落库 js 头部的「// Source: issue #N」标记。
            let reusedFromIssue = false;
            const issueMarker = 'Source: issue #' + issueNumber;
            for (const existing of list) {
              const p = path.join(extDir, existing + '.js');
              if (!fs.existsSync(p)) continue;
              const head = fs.readFileSync(p, 'utf-8').split('\n').slice(0, 12).join('\n');
              if (head.includes(issueMarker)) {
                slug = existing;
                reusedFromIssue = true;
                log('♻️ 议题 #' + issueNumber + ' 此前已同步为 :', slug, '→ 本次覆盖更新');
                break;
              }
            }

            if (!reusedFromIssue && list.includes(slug)) {
              let i = 2;
              while (list.includes(slug + '-' + i)) i++;
              slug = slug + '-' + i;
              log('⚠️ slug 已存在，重命名为 :', slug);
            }
            endGroup();

            if (!slug) {
              core.setFailed('无法从「名称」生成标识：' + name);
              return;
            }

            // 收集议题正文 + 所有评论里的 .js 附件链接
            // 注意排除引号/尖括号：GitHub 拖图会生成 <img src="URL" /> HTML，
            // 老正则 [^\s)\]]+ 会把尾部引号一起吞掉导致下载 404。
            const collectJs = (text) => {
              const out = [];
              for (const m of (text || '').matchAll(/https?:\/\/[^\s)\]"'<>]+\.js/gi)) out.push(m[0]);
              for (const m of (text || '').matchAll(/https?:\/\/github\.com\/user-attachments\/files\/[^\s)\]"'<>]+/gi)) out.push(m[0]);
              return out;
            };

            // ===== 收集 .js 链接 =====
            group('⑥ 收集 .js 扩展链接');
            const jsUrls = collectJs(body);
            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              });
              for (const c of (comments.data || [])) jsUrls.push(...collectJs(c.body));
            } catch (e) {
              log('读取评论失败，仅使用正文链接：', e.message);
            }
            if (jsUrls.length === 0) {
              log('❌ 未找到任何 .js 链接。');
              endGroup();
              core.setFailed('议题正文及评论中均未找到 .js 附件链接。');
              return;
            }
            jsUrls.forEach((u, i) => log('  [' + i + ']', u));
            const jsUrl = jsUrls[0];
            log('✅ 选用链接 :', jsUrl);
            endGroup();

            // ===== 下载 .js =====
            group('⑦ 下载扩展代码');
            log('GET', jsUrl);
            const res = await fetch(jsUrl, {
              redirect: 'follow',
              headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}` }
            });
            log('HTTP 状态 :', res.status, res.statusText);
            log('Content-Type :', res.headers.get('content-type'));
            log('Content-Length :', res.headers.get('content-length'));
            if (!res.ok) {
              endGroup();
              core.setFailed('下载扩展失败：HTTP ' + res.status);
              return;
            }
            let code = await res.text();
            log('已下载字节数 :', code.length);
            endGroup();

            // 元数据以议题为准：丢弃 js 文件自带的顶部 // 头注释（builder 会解析它），
            // 统一注入由议题字段生成的元信息头。js 文件只是代码附件。
            group('⑧ 注入元信息头（以议题字段为准）');
            const srcLines = code.split('\n');
            let headEnd = 0;
            while (headEnd < srcLines.length && /^\s*\/\//.test(srcLines[headEnd])) headEnd++;
            if (headEnd > 0) {
              log('已移除文件自带头注释行数 :', headEnd);
            }
            code = srcLines.slice(headEnd).join('\n').replace(/^\s*\n/, '');
            const header = [
              '// Name: ' + name,
              '// ID: ' + slug,
              '// Description: ' + (summary || (name + ' 扩展。')),
              author ? '// By: ' + author : '',
              version ? '// Version: ' + version : '',
              '// License: MIT',
              '// Source: issue #' + issueNumber
            ].filter(Boolean).join('\n');
            code = header + '\n\n' + code;
            log('注入头 :\n' + header);
            endGroup();

            const jsPath = path.join(extDir, slug + '.js');
            fs.writeFileSync(jsPath, code);
            log('✅ 已写入扩展文件 :', jsPath, '(' + code.length + ' 字节)');

            // 收集封面图（同样排除引号/尖括号，兼容 <img src="..."> 与 markdown 两种写法）
            const collectImg = (text) => {
              const out = [];
              for (const m of (text || '').matchAll(/https?:\/\/[^\s)\]"'<>]+\.(?:png|jpe?g|gif|webp)/gi)) out.push(m[0]);
              for (const m of (text || '').matchAll(/https?:\/\/github\.com\/user-attachments\/assets\/[^\s)\]"'<>]+/gi)) out.push(m[0]);
              return out;
            };

            // ===== 收集并下载封面图 =====
            group('⑨ 收集封面图');
            const imgUrls = collectImg(body);
            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              });
              for (const c of (comments.data || [])) imgUrls.push(...collectImg(c.body));
            } catch (e) { /* 忽略 */ }
            if (imgUrls.length === 0) {
              log('未找到任何图片链接。');
            } else {
              imgUrls.forEach((u, i) => log('  [' + i + ']', u));
            }
            const pbUrl = imgUrls.find(u => /\/pb\.png(\?|$)/i.test(u)) || imgUrls[0];
            log('选用封面链接 :', pbUrl || '(无)');

            let imagePath = null;
            if (pbUrl) {
              try {
                log('GET', pbUrl);
                const imgRes = await fetch(pbUrl, {
                  redirect: 'follow',
                  headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}` }
                });
                log('HTTP 状态 :', imgRes.status, imgRes.statusText);
                if (imgRes.ok) {
                  const buf = Buffer.from(await imgRes.arrayBuffer());
                  log('已下载字节数 :', buf.length);
                  const isPng = buf[0] === 0x89 && buf[1] === 0x50 && buf[2] === 0x4e && buf[3] === 0x47;
                  const isJpg = buf[0] === 0xff && buf[1] === 0xd8 && buf[2] === 0xff;
                  const ext = isJpg ? 'jpg' : 'png';
                  const imgDir = 'images';
                  fs.mkdirSync(imgDir, { recursive: true });
                  imagePath = path.join(imgDir, slug + '.' + ext);
                  fs.writeFileSync(imagePath, buf);
                  log('✅ 已保存封面图 :', imagePath, '(格式判定:', ext + ')');
                } else {
                  log('❌ 封面图下载失败：HTTP', imgRes.status);
                }
              } catch (e) {
                log('❌ 封面图处理出错：', e.message);
              }
            } else {
              log('ℹ️ 未找到封面图，将使用默认封面 unknown.svg。');
            }
            endGroup();

            // ===== 更新扩展列表 =====
            group('⑩ 更新 extensions.json');
            if (!list.includes(slug)) list.push(slug);
            fs.writeFileSync(jsonPath, JSON.stringify(list, null, 2) + '\n');
            log('新列表 :', JSON.stringify(list));
            endGroup();

            // ===== 提交并推送 =====
            group('⑪ 提交到仓库');
            try {
              execSync('git config user.name "github-actions[bot]"');
              execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
              const addTargets = [jsonPath, jsPath];
              if (imagePath) addTargets.push(imagePath);
              log('git add :', addTargets.join(' '));
              execSync(`git add ${addTargets.join(' ')}`);
              const commitMsg = `sync: ${slug} (from issue #${issueNumber})`;
              execSync(`git commit -m "${commitMsg}"`);
              log('commit :', commitMsg);
              execSync('git push');
              log('✅ 已推送到远程。');
            } catch (e) {
              log('❌ 提交/推送失败：', e.message);
              log('（若因分支保护导致 push 失败，请在仓库 Settings → Branches 放行 github-actions[bot]，或改用 PR 方式同步）');
              endGroup();
              core.setFailed('git 提交或推送失败：' + e.message);
              return;
            }
            endGroup();

            // 触发部署工作流
            group('⑫ 触发部署工作流');
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy.yml',
                ref: 'master'
              });
              log('✅ 已触发 deploy.yml (ref=master)');
            } catch (e) {
              log('⚠️ 触发部署失败（不影响已提交的扩展）：', e.message);
            }
            endGroup();

            // ===== 完成摘要 =====
            group('✅ 同步完成摘要');
            log('slug      :', slug);
            log('扩展名称  :', name);
            log('版本号    :', version || '(无)');
            log('作者      :', author || '(无)');
            log('简介      :', summary || '(无)');
            log('扩展文件  :', jsPath);
            log('封面图    :', imagePath || '(默认 unknown.svg)');
            log('扩展列表数:', list.length);
            endGroup();
